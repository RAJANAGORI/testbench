# SCAS Command Center — landing :5173, dashboard :3100, control-plane :3101
# Requires Docker socket so control-plane can start scenario compose labs.
# From repo root: docker compose -f docker/compose/ui.yml up -d --build
name: scas-ui

services:
  control-plane:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.ui
    container_name: scas-ui-control-plane
    working_dir: /repo
    volumes:
      - ../..:/repo
      - /var/run/docker.sock:/var/run/docker.sock
      - scas-ui-node-modules:/repo/node_modules
      - scas-ui-nm-cp:/repo/apps/control-plane/node_modules
      - scas-ui-nm-dash:/repo/apps/dashboard/node_modules
      - scas-ui-nm-land:/repo/apps/landing/node_modules
    environment:
      SCAS_REPO_ROOT: /repo
      SCAS_LAB_BACKEND: docker
      SCAS_CAPTURE_HOST: host.docker.internal
      SCAS_PLATFORM_HOST: host.docker.internal
      CONTROL_PLANE_HOST: 0.0.0.0
      CONTROL_PLANE_PORT: "3101"
      TESTBENCH_MODE: enabled
    ports:
      - "3101:3101"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["npm", "run", "dev:control-plane"]
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:3101/api/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 60s

  dashboard:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.ui
    container_name: scas-ui-dashboard
    working_dir: /repo
    volumes:
      - ../..:/repo
      - scas-ui-node-modules:/repo/node_modules
      - scas-ui-nm-cp:/repo/apps/control-plane/node_modules
      - scas-ui-nm-dash:/repo/apps/dashboard/node_modules
      - scas-ui-nm-land:/repo/apps/landing/node_modules
    environment:
      SCAS_REPO_ROOT: /repo
      CONTROL_PLANE_HOST: control-plane
      CONTROL_PLANE_PORT: "3101"
      NEXT_PUBLIC_CONTROL_PLANE_URL: http://127.0.0.1:3101
      SCAS_PUBLIC_HOST: 0.0.0.0
    ports:
      - "3100:3100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      control-plane:
        condition: service_healthy
    command: ["npm", "run", "dev:dashboard"]

  landing:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.ui
    container_name: scas-ui-landing
    working_dir: /repo
    volumes:
      - ../..:/repo
      - scas-ui-node-modules:/repo/node_modules
      - scas-ui-nm-cp:/repo/apps/control-plane/node_modules
      - scas-ui-nm-dash:/repo/apps/dashboard/node_modules
      - scas-ui-nm-land:/repo/apps/landing/node_modules
    environment:
      VITE_DASHBOARD_URL: http://localhost:3100
      VITE_CONTROL_PLANE_URL: http://localhost:3101
    ports:
      - "5173:5173"
    depends_on:
      control-plane:
        condition: service_healthy
    command: ["npm", "run", "dev:landing"]

volumes:
  scas-ui-node-modules:
  scas-ui-nm-cp:
  scas-ui-nm-dash:
  scas-ui-nm-land:
